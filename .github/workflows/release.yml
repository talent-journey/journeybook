name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RUBY_VERSION: ruby-3.4.8
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Verify release tag matches gem version
        if: github.event_name == 'push'
        run: test "${GITHUB_REF_NAME}" = "v$(bundle exec ruby -Ilib -r journeybook/version -e 'print Journeybook::VERSION')"

      - name: Run tests
        run: bin/rails db:test:prepare && bin/rails test

      - name: Lint code
        run: bin/rubocop -f github

      - name: Build gem
        run: bundle exec rake build

      - name: Validate package
        run: |
          gem check pkg/journeybook-*.gem
          ruby -rrubygems/package -e 'spec = Gem::Package.new(Dir["pkg/journeybook-*.gem"].first).spec; required = %w[CHANGELOG.md MIT-LICENSE README.md Rakefile lib/journeybook.rb]; abort "Missing packaged files" unless required.all? { |file| spec.files.include?(file) }; puts "Package validated: #{spec.name} #{spec.version} (#{spec.files.length} files)"'

      - name: Smoke test installed gem
        run: |
          smoke_dir=$(mktemp -d)
          gem install --local --ignore-dependencies --no-document --install-dir "$smoke_dir" pkg/journeybook-*.gem
          GEM_HOME="$smoke_dir" GEM_PATH="$smoke_dir:$(ruby -e 'puts Gem.path.join(":")')" ruby -rrails -e 'gem "journeybook"; require "journeybook"; puts "Installed gem loads"'

      - name: Publish to RubyGems
        if: github.event_name == 'push'
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: gem push pkg/journeybook-*.gem
